<div id="password-overlay" class="password-overlay">
    <div class="password-modal">
        <div class="lock-icon">🔒</div>
        <h2>Restricted Access</h2>
        <p>Please enter the access code to view this content.</p>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Enter Code" onkeypress="handleEnter(event)">
            <button onclick="checkPassword()">Unlock</button>
        </div>
        <p id="password-error" class="error-message" style="display: none; color: #ff4444;">Incorrect code</p>
    </div>
</div>

<style>
    .password-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(10px);
    }

    .password-modal {
        background: rgba(255, 255, 255, 0.1);
        padding: 2rem;
        border-radius: 1rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        max-width: 90%;
        width: 320px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .lock-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .input-group {
        margin: 1.5rem 0;
        display: flex;
        gap: 0.5rem;
    }

    #password-input {
        padding: 0.5rem;
        border-radius: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        width: 100%;
    }

    button {
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        border: none;
        background: #3b82f6;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #2563eb;
    }

    @keyframes shake {

        0%,
        100% {
            transform: translateX(0);
        }

        25% {
            transform: translateX(-10px);
        }

        75% {
            transform: translateX(10px);
        }
    }

    .shake {
        animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
    }
</style>

<script>
    console.log("Password gate script loaded");

    // Expose function to global scope explicitly
    window.checkPassword = function () {
        console.log("Attempting to unlock...");
        try {
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');
            const content = document.getElementById('protected-content');
            const overlay = document.getElementById('password-overlay');

            if (!content) {
                console.error("Error: 'protected-content' element not found.");
                // If content is missing, we can't show it, but we can try to hide overlay
                // or just reload the page if this state is invalid.
                alert("Error: Protected content area missing. Please refresh.");
                return;
            }

            // Using simple string matching for client-side visual protection
            const validCode = "{{ .Params.password }}";
            console.log("Configured code:", validCode);

            // Check for exact match or numeric equivalence
            if (input.value === validCode || (validCode && !isNaN(validCode) && Number(input.value) === Number(validCode))) {
                console.log("Password correct. Unlocking.");
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    content.style.display = 'block';
                    // Save specific to the code, so once entered, it unlocks everywhere using that code
                    sessionStorage.setItem('unlocked_code_' + validCode, 'true');

                    // Trigger a custom event in case other scripts need to know
                    document.dispatchEvent(new Event('content-unlocked'));
                }, 500);
            } else {
                console.log("Password incorrect.");
                error.style.display = 'block';
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 500);
            }
        } catch (e) {
            console.error("Error in checkPassword:", e);
            alert("System Error: " + e.message);
        }
    };

    window.handleEnter = function (e) {
        if (e.key === 'Enter') {
            window.checkPassword();
        }
    };

    // Auto-unlock if previously unlocked in this session
    // We use a function to run this check so it can be called on swup:contentReplaced if needed
    window.checkLockStatus = function () {
        const validCode = "{{ .Params.password }}";
        const lockKey = 'unlocked_code_' + validCode;
        console.log("Checking lock status for key:", lockKey);

        if (sessionStorage.getItem(lockKey) === 'true') {
            console.log("Content already unlocked for this code.");
            const overlay = document.getElementById('password-overlay');
            const content = document.getElementById('protected-content');
            if (overlay) overlay.style.display = 'none';
            if (content) content.style.display = 'block';
        } else {
            console.log("Content locked.");
        }
    };

    // Run check on DOMContentLoaded to ensure #protected-content exists
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.checkLockStatus);
    } else {
        // DOM already ready (e.g. Swup navigation or cached state)
        // Use setTimeout to push it to the end of the stack, ensuring DOM is painted/ready
        setTimeout(window.checkLockStatus, 10);
    }

    // Also re-run on Swup navigation
    document.addEventListener('swup:contentReplaced', function () {
        setTimeout(window.checkLockStatus, 10);
    });
</script>
