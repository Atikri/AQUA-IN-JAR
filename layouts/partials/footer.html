<footer>
    <div class="footer-content">
        {{- with .Site.Copyright }}
        <p>{{ . }}</p>
        {{- else }}
        <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
        {{- end }}
        <a href="{{ " index.xml" | absURL }}" class="rss-link" aria-label="RSS Feed" title="Subscribe via RSS">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 11a9 9 0 0 1 9 9"></path>
                <path d="M4 4a16 16 0 0 1 16 16"></path>
                <circle cx="5" cy="19" r="1"></circle>
            </svg>
            RSS
        </a>
    </div>
</footer>

<!-- Back to top button (site-wide) -->
<button id="backToTop" class="back-to-top" aria-label="Back to top">
    {{- with .Site.Params.backToTopImage -}}
    <img src="{{ . | absURL }}" alt="Back to top" />
    {{- else -}}
    <span>↑</span>
    {{- end -}}
</button>

<script>
    (function () {
        const btn = document.getElementById('backToTop');
        if (!btn) return;
        const showAt = 300;
        function onScroll() {
            if (window.scrollY > showAt) btn.style.display = 'flex';
            else btn.style.display = 'none';
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();
</script>

<!-- Medium Zoom -->
<script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        mediumZoom('article.content-container img:not(.nav-image img)', {
            margin: 24,
            background: 'var(--bg-color, #f0eee6)',
            scrollOffset: 0
        });
    });
</script>
