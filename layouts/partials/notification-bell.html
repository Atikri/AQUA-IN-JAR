{{- $notifications := .Site.Data.notifications -}}
<!-- Notification Bell -->
<div class="notification-wrapper">
    <button id="notificationBtn" class="header-icon-btn" aria-label="Notifications" title="Notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="bell-icon">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <!-- Badge -->
        <span id="notifBadge" class="notif-badge hidden"></span>
    </button>

    <!-- Notification Panel -->
    <div id="notificationPanel" class="notification-panel" aria-hidden="true">
        <div class="notif-header">
            <h3>通知中心</h3>
            <button id="markAllRead" class="text-btn">全部已读</button>
        </div>
        <div class="notif-list">
            {{- if $notifications -}}
            {{- range $notifications -}}
            <div class="notif-item {{ if .important }}important{{ end }}" data-id="{{ .id }}" data-url="{{ .link }}">
                <div class="notif-item-header">
                    <span class="notif-title">{{ .title }}</span>
                    <span class="notif-date">{{ .date }}</span>
                </div>
                <p class="notif-content">{{ .content }}</p>
                {{ if .link }}<span class="read-more-link">点击查看内容 →</span>{{ end }}
            </div>
            {{- end -}}
            {{- else -}}
            <div class="notif-empty">暂无新消息哦~</div>
            {{- end -}}
        </div>
    </div>
</div>

<script>
    window.initNotifications = function() {
        const btn = document.getElementById('notificationBtn');
        const panel = document.getElementById('notificationPanel');
        const badge = document.getElementById('notifBadge');
        const items = document.querySelectorAll('.notif-item');
        const markAllBtn = document.getElementById('markAllRead');

        if (!btn || !panel) return; // Prevent errors if missing

        // Check for unread
        const checkUnread = () => {
            const lastSeen = localStorage.getItem('last_notif_seen') || '[]';
            const seenIds = JSON.parse(lastSeen);
            let unreadCount = 0;

            items.forEach(item => {
                const id = item.getAttribute('data-id');
                if (!seenIds.includes(id)) {
                    item.classList.add('unread');
                    unreadCount++;
                } else {
                    item.classList.remove('unread');
                }
            });

            if (unreadCount > 0) {
                badge.classList.remove('hidden');
                badge.innerText = unreadCount > 9 ? '9+' : unreadCount;
                btn.classList.add('has-unread');
            } else {
                badge.classList.add('hidden');
                btn.classList.remove('has-unread');
            }
        };

        // Toggle Panel
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            panel.classList.toggle('active');
            const isOpen = panel.classList.contains('active');
            panel.setAttribute('aria-hidden', !isOpen);

            if (isOpen) {
                // Close other panels
                document.querySelectorAll('.display-settings-panel, .header-search-panel').forEach(p => {
                    if (p !== panel) p.classList.remove('active');
                });
            }
        });

        // Mark Individual as Read and Navigate
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                const id = item.getAttribute('data-id');
                const url = item.getAttribute('data-url');

                // Add to seen
                const lastSeen = JSON.parse(localStorage.getItem('last_notif_seen') || '[]');
                if (!lastSeen.includes(id)) {
                    lastSeen.push(id);
                    localStorage.setItem('last_notif_seen', JSON.stringify(lastSeen));
                    checkUnread();
                }

                // Handle Link with Swup if possible
                if (url && url !== "undefined") {
                    if (window.swup) {
                        panel.classList.remove('active');
                        swup.navigate(url);
                    } else {
                        window.location.href = url;
                    }
                }
            });
        });

        // Mark All as Read
        if (markAllBtn) {
            markAllBtn.addEventListener('click', () => {
                const ids = Array.from(items).map(i => i.getAttribute('data-id'));
                localStorage.setItem('last_notif_seen', JSON.stringify(ids));
                checkUnread();
            });
        }

        // Keep single global listener or handle carefully
        // To avoid multiple listeners on document, we can name the function
        const closePanelOutside = (e) => {
            if (!panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove('active');
            }
        };
        // Remove prior event to prevent stacking
        document.removeEventListener('click', window._closePanelOutsideNotif || (() => {}));
        document.addEventListener('click', closePanelOutside);
        window._closePanelOutsideNotif = closePanelOutside;

        checkUnread();
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.initNotifications);
    } else {
        window.initNotifications();
    }
</script>
