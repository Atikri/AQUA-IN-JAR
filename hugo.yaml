baseURL: https://tikri.site/
languageCode: en-us 
title: AQUA IN JAR 
theme: dario
params:
  colorScheme: light
  # Google Analytics 4
  googleAnalytics: "G-JLYX55NFNN"  # 你的GA4测量ID
  backToTopImage: images/navigation/top.png

# Main sections for navigation
mainSections: ['notification-jar', 'aquas-field', 'podcast-music', 'toolbox']

# Enable Table of Contents
markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      taskList: true
      table: true
      strikethrough: true
      linkify: true
      typographer: true
  highlight:
    style: github
    codeFences: true
    lineNos: true
    copy: true
    anchorLineNos: true
    guessSyntax: true
    tabWidth: 2
    wrap: true

# Enable emoji support
enableEmoji: true

# Ensure all generated asset links use absolute URLs from baseURL
canonifyURLs: true

# Output formats for search
outputs:
  home: ["HTML", "JSON"]

# Development settings
disablePathToLower: true

# Build settings
buildFuture: true

# Using GitHub Actions to deploy; output directory is controlled by the workflow
