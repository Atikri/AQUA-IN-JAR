<div id="password-overlay" class="password-overlay">
    <div class="password-modal">
        <div class="lock-icon">🔒</div>
        <h2>Restricted Access</h2>
        <p>Please enter the access code to view this content.</p>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Enter Code" onkeypress="handleEnter(event)">
            <button onclick="checkPassword()">Unlock</button>
        </div>
        <p id="password-error" class="error-message" style="display: none; color: #ff4444;">Incorrect code</p>
    </div>
</div>

<style>
    .password-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(10px);
    }

    .password-modal {
        background: rgba(255, 255, 255, 0.1);
        padding: 2rem;
        border-radius: 1rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        max-width: 90%;
        width: 320px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .lock-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .input-group {
        margin: 1.5rem 0;
        display: flex;
        gap: 0.5rem;
    }

    #password-input {
        padding: 0.5rem;
        border-radius: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        width: 100%;
    }

    button {
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        border: none;
        background: #3b82f6;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #2563eb;
    }
</style>

<script>
    function checkPassword() {
        const input = document.getElementById('password-input');
        const error = document.getElementById('password-error');
        const content = document.getElementById('protected-content');
        const overlay = document.getElementById('password-overlay');
        // Using simple string matching for client-side visual protection
        // To allow multiple codes, we could check an array
        const validCode = "{{ .Params.password }}";

        if (input.value === validCode) {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                content.style.display = 'block';
                // Optional: Save to session storage so they don't have to re-enter
                sessionStorage.setItem('unlocked_' + window.location.pathname, 'true');
            }, 500);
        } else {
            error.style.display = 'block';
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 500);
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    }

    // Auto-unlock if previously unlocked in this session
    document.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('unlocked_' + window.location.pathname) === 'true') {
            const overlay = document.getElementById('password-overlay');
            const content = document.getElementById('protected-content');
            if (overlay) overlay.style.display = 'none';
            if (content) content.style.display = 'block';
        }
    });
</script>
