{{ with site.Params.author.email }}
<meta name="email" content="{{ . }}">
{{ end }}
{{ with site.Params.author.twitter }}
<meta name="twitter" content="{{ . }}">
{{ end }}

<!-- 禁止百度等移动浏览器对页面进行转码 -->
<meta http-equiv="Cache-Control" content="no-transform" />
<meta http-equiv="Cache-Control" content="no-siteapp" />
<meta name="applicable-device" content="pc,mobile">
<meta name="HandheldFriendly" content="true" />

{{ if site.Params.googleAnalytics }}
<!-- Google Analytics 4 - 优化加载 -->
<script>
  // 延迟加载Google Analytics，避免阻塞页面渲染
  function loadGA() {
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.Params.googleAnalytics }}';
    script.onload = function() {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.Params.googleAnalytics }}');
    };
    document.head.appendChild(script);
  }
  
  // 页面加载完成后延迟加载GA
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadGA);
  } else {
    setTimeout(loadGA, 100);
  }
</script>
{{ end }}

<!-- Enable interactive task list checkboxes and persist state in localStorage -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var checkboxes = document.querySelectorAll('li input[type="checkbox"]');
    checkboxes.forEach(function (cb, idx) {
      // 确保可交互：去除 disabled，并提供可聚焦
      if (cb.hasAttribute('disabled')) cb.removeAttribute('disabled');
      if (!cb.hasAttribute('tabindex')) cb.setAttribute('tabindex', '0');
      cb.setAttribute('role', 'checkbox');

      var key = 'tasklist:' + (cb.id || cb.name || idx) + ':' + location.pathname;
      try {
        var saved = localStorage.getItem(key);
        if (saved !== null) cb.checked = saved === '1';
        cb.addEventListener('change', function () {
          localStorage.setItem(key, cb.checked ? '1' : '0');
        });
      } catch (e) {}
    });

    (function () {
        const btn = document.getElementById('backToTop');
        if (!btn) return;
        const showAt = 300;
        let ticking = false;

        function onScroll() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    if (window.scrollY > showAt) btn.style.display = 'flex';
                    else btn.style.display = 'none';
                    ticking = false;
                });
                ticking = true;
            }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();
  });
  // Make sure Markdown-rendered checkboxes are interactive
  document.addEventListener('click', function (e) {
    if (e.target && e.target.matches('li input[type="checkbox"]')) {
      if (e.target.hasAttribute('disabled')) e.target.removeAttribute('disabled');
      // 交互由浏览器默认行为处理，这里不再手动反置，避免双重切换
    }
  });
  // 键盘切换（空格键）
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target && e.target.matches('li input[type="checkbox"]')) {
      e.preventDefault();
      if (e.target.hasAttribute('disabled')) e.target.removeAttribute('disabled');
      e.target.checked = !e.target.checked;
      e.target.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
</script>
