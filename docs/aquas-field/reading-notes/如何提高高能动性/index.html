<script>
  document.addEventListener('DOMContentLoaded', function () {
    var checkboxes = document.querySelectorAll('li input[type="checkbox"]');
    checkboxes.forEach(function (cb, idx) {
      
      if (cb.hasAttribute('disabled')) cb.removeAttribute('disabled');
      if (!cb.hasAttribute('tabindex')) cb.setAttribute('tabindex', '0');
      cb.setAttribute('role', 'checkbox');

      var key = 'tasklist:' + (cb.id || cb.name || idx) + ':' + location.pathname;
      try {
        var saved = localStorage.getItem(key);
        if (saved !== null) cb.checked = saved === '1';
        cb.addEventListener('change', function () {
          localStorage.setItem(key, cb.checked ? '1' : '0');
        });
      } catch (e) {}
    });
  });
  
  document.addEventListener('click', function (e) {
    if (e.target && e.target.matches('li input[type="checkbox"]')) {
      if (e.target.hasAttribute('disabled')) e.target.removeAttribute('disabled');
      
    }
  });
  
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target && e.target.matches('li input[type="checkbox"]')) {
      e.preventDefault();
      if (e.target.hasAttribute('disabled')) e.target.removeAttribute('disabled');
      e.target.checked = !e.target.checked;
      e.target.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
</script>
