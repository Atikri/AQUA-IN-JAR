- content: "They have thoughts and experience, but they just often, young adults haven't articulated that to themselves.——《What I Wish I Knew In My 20s》"
  author: "Mel Robbins"
- content: "The entries in the first three months will help rid you of all the external voices telling you about which career path to follow,  and instead will connect you to your own voice, to what makes you unique, to your purpose and calling in life.——《The Daily Laws》"
  author: "Robert Greene"
- content: "可以说“有”与“无”共同组成了存在，就像声音是由声与静的快速交替构成的。"
  author: "Alan Watts" 
- content: "薯片的“嘎吱声”、可乐的“汽泡量”、奥利奥的“脆壳+奶油”组合...每一个细节都经过精心设计，目的就是让你的大脑产生“还想要更多”的冲动--《How to Eat Healthy Without Thinking》"
  author: "James Clear" 
- content: "To free the voice is to free the person, and each person is indivisibly mind and body.——《Freeing the natural voice》"
  author: "Kristin Linklater" 
- content: "Don’t bother just to be better than your contemporaries or predecessors. Try to be better than yourself."
  author: "William Faulkner"
- content: "The way to recover the meaning of life and the worthwhileness of life is to recover the power of experience, to have impulse voices from within, and to be able to hear these impulse voices from within."
  author: "Abraham Maslow"
- content: "对于Coltrane来说，他追求的并非仅仅是“音乐”，而是如何为强大的情感赋予声音。——《The Daily Laws》"
  author: "Robert Greene"
- content: "You can't wait for somebody to magically take care of everything.The reality is you have the power within yourself to change your circumstance, and it's just believing it.——Mel Robbins Podcast《#1 Neurosurgeon:How to Manifest Anything You Want&Unlock the Unlimited Power of Your Mind》"
  author: "Dr.Jim Doty"
- content: “The voice’s limits lie only in the limits of desire, talent, imagination, or life experience.”
  author: "Kristin Linklater"



