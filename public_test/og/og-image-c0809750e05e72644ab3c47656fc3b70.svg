                <div style="font-family: Newsreader, serif; font-size: 78px; font-weight: 600; margin-bottom: 20px; word-wrap: break-word;">同学留言本</div>
                <div style="font-family: Newsreader, serif; font-size: 70px; font-weight: 400; word-wrap: break-word;">小学那时候我们毕业很多人都会买一些留言本，然后互赠，填写一些寄语啊什么的。 这个留言本我一直珍藏到现在，今天打扫的时候又翻到，挑选一些拍照记录下来了，毕竟真的随着时间流逝，很多东西不能一直以实体的形式保存🤧 同学的名字做了处理（已经记在心里面了🥰 ）</div>
            </div>
