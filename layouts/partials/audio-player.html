<div id="audio-player-container" class="audio-player-floating">
    <!-- Hidden Audio Element -->
    <audio id="global-audio" preload="none"></audio>

    <!-- Minimized View (Optional, maybe just the bar) -->
    <div class="player-bar glass-panel">
        <!-- Cover Art / Play Info -->
        <div class="track-info">
            <div class="track-cover" id="track-cover">
                <div class="vinyl-spin"></div>
            </div>
            <div class="track-details">
                <span id="track-title" class="track-title">Select a Track</span>
                <span id="track-artist" class="track-artist">Mixtape</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="player-controls">
            <button id="prev-btn" class="control-btn" aria-label="Previous">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="19 20 9 12 19 4 19 20"></polygon>
                    <line x1="5" y1="19" x2="5" y2="5"></line>
                </svg>
            </button>
            <button id="play-btn" class="control-btn play-btn" aria-label="Play">
                <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"
                    style="display:none;">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
            </button>
            <button id="next-btn" class="control-btn" aria-label="Next">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 4 15 12 5 20 5 4"></polygon>
                    <line x1="19" y1="5" x2="19" y2="19"></line>
                </svg>
            </button>
        </div>

        <!-- Playlist Toggle -->
        <button id="playlist-toggle" class="control-btn playlist-btn" aria-label="Playlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </button>

        <!-- Minimize Toggle -->
        <button id="minimize-btn" class="minimize-toggle" aria-label="Minimize">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>

        <!-- Progress Bar Background (Bottom) -->
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- Playlist Drawer -->
    <div id="playlist-drawer" class="playlist-drawer glass-panel">
        <div class="playlist-header">
            <h3>Lo-Fi Mixtape</h3>
            <button id="close-playlist" class="close-btn">×</button>
        </div>
        <ul class="playlist-tracks" id="playlist-list">
            <!-- Populated by JS -->
            {{ range $index, $track := .Site.Data.playlist }}
            <li class="playlist-item" data-index="{{ $index }}" data-url="{{ .url }}" data-title="{{ .title }}"
                data-artist="{{ .artist }}" data-cover="{{ .cover }}">
                <span class="item-number">{{ add $index 1 }}</span>
                <div class="item-info">
                    <span class="item-title">{{ .title }}</span>
                    <span class="item-artist">{{ .artist }}</span>
                </div>
                <div class="item-visual">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </li>
            {{ end }}
        </ul>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('global-audio');
        const container = document.getElementById('audio-player-container');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playlistToggle = document.getElementById('playlist-toggle');
        const minimizeBtn = document.getElementById('minimize-btn');
        const closePlaylist = document.getElementById('close-playlist');
        const playlistDrawer = document.getElementById('playlist-drawer');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const trackCover = document.getElementById('track-cover');
        const playlistItems = document.querySelectorAll('.playlist-item');

        let currentIndex = 0;
        let isPlaying = false;

        // Restore State logic could go here

        function loadTrack(index) {
            const item = playlistItems[index];
            if (!item) return;

            const url = item.dataset.url;
            const title = item.dataset.title;
            const artist = item.dataset.artist;
            const cover = item.dataset.cover;

            audio.src = url;
            trackTitle.textContent = title;
            trackArtist.textContent = artist;
            trackCover.style.backgroundImage = `url('${cover}')`;

            // Highlight active item
            playlistItems.forEach(el => el.classList.remove('active'));
            item.classList.add('active');

            currentIndex = index;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayBtn();
                    trackCover.classList.add('spinning');
                }).catch(err => console.error("Playback error:", err));
            } else {
                audio.pause();
                isPlaying = false;
                updatePlayBtn();
                trackCover.classList.remove('spinning');
            }
        }

        function updatePlayBtn() {
            if (audio.paused) {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            } else {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
        }

        // Controls
        playBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = playlistItems.length - 1;
            loadTrack(newIndex);
            togglePlay();
        });

        nextBtn.addEventListener('click', () => {
            let newIndex = currentIndex + 1;
            if (newIndex >= playlistItems.length) newIndex = 0;
            loadTrack(newIndex);
            togglePlay();
        });

        // Playlist Interaction
        playlistToggle.addEventListener('click', () => {
            playlistDrawer.classList.toggle('open');
        });

        closePlaylist.addEventListener('click', () => {
            playlistDrawer.classList.remove('open');
        });

        playlistItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                if (currentIndex === index && !audio.paused) {
                    togglePlay(); // Pause if clicking current
                } else {
                    loadTrack(index);
                    togglePlay();
                }
            });
        });

        // Minimize Logic
        minimizeBtn.addEventListener('click', () => {
            container.classList.toggle('minimized');
            const isMin = container.classList.contains('minimized');
            localStorage.setItem('audio_player_minimized', isMin);

            // Close playlist if preventing overlap
            if (isMin) playlistDrawer.classList.remove('open');
        });

        // Drag & Drop Functionality
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        // Restore saved position
        const savedX = localStorage.getItem('audio_player_x');
        const savedY = localStorage.getItem('audio_player_y');
        if (savedX && savedY) {
            xOffset = parseInt(savedX);
            yOffset = parseInt(savedY);
            setPosition();
        } else {
            // Get the player's current rendered position on first drag
            const rect = container.getBoundingClientRect();
            xOffset = rect.left;
            yOffset = rect.top;
        }

        function setPosition() {
            // Calculate boundaries to keep player on screen
            const rect = container.getBoundingClientRect();
            const maxX = window.innerWidth - rect.width;
            const maxY = window.innerHeight - rect.height;

            // Constrain within viewport
            const constrainedX = Math.max(0, Math.min(xOffset, maxX));
            const constrainedY = Math.max(0, Math.min(yOffset, maxY));

            container.style.left = constrainedX + 'px';
            container.style.top = constrainedY + 'px';
            container.style.bottom = 'auto';
            container.style.transform = 'none';
        }

        function dragStart(e) {
            // Don't start drag if clicking on controls or progress bar
            if (e.target.closest('.control-btn, .progress-container, .playlist-item')) {
                return;
            }

            if (e.type === 'touchstart') {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }

            isDragging = true;
            container.style.cursor = 'grabbing';
        }

        function drag(e) {
            if (!isDragging) return;

            e.preventDefault();

            if (e.type === 'touchmove') {
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
            } else {
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
            }

            xOffset = currentX;
            yOffset = currentY;

            setPosition();
        }

        function dragEnd(e) {
            if (!isDragging) return;

            initialX = currentX;
            initialY = currentY;
            isDragging = false;
            container.style.cursor = 'grab';

            // Save position
            localStorage.setItem('audio_player_x', xOffset);
            localStorage.setItem('audio_player_y', yOffset);
        }

        // Mouse events
        container.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        // Touch events for mobile
        container.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', dragEnd);

        // Reset position on window resize
        window.addEventListener('resize', () => {
            if (savedX && savedY) {
                setPosition();
            }
        });

        // Set initial cursor
        container.style.cursor = 'grab';


        // Progress
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        // Initial Load (Recover from storage)
        const savedIndex = localStorage.getItem('audio_track_index');
        const savedTime = localStorage.getItem('audio_track_time'); // Not used for now to avoid auto-seek issues
        const wasPlaying = localStorage.getItem('audio_is_playing') === 'true';
        const isMinimized = localStorage.getItem('audio_player_minimized') === 'true';

        if (isMinimized) {
            container.classList.add('minimized');
        }

        if (savedIndex !== null) {
            loadTrack(parseInt(savedIndex));
            // if (savedTime) audio.currentTime = parseFloat(savedTime);
            // Autoplay is tricky on reload, browsers block it. 
            // So we don't auto-call togglePlay() unless interact happens, or we leave it paused.
        } else {
            loadTrack(0); // Default to first
        }

        // Save state on unload
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('audio_track_index', currentIndex);
            localStorage.setItem('audio_track_time', audio.currentTime);
            localStorage.setItem('audio_is_playing', !audio.paused);
        });
    });
</script>
