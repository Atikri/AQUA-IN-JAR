baseURL: http://localhost:1313/
languageCode: zh-hans
title: AQUA IN JAR 
theme: dario
hasCJKLanguage: true
isCJKLanguage: true
copyright: "© 2026 AQUA IN JAR"
params:
  colorScheme: toggle
  # Google Analytics 4
  readingSpeed: 200 # Optional: customize reading speed (words/characters per minute)
  googleAnalytics: "G-JLYX55NFNN"  # 你的GA4测量ID
  backToTopImage: images/navigation/top.png

# Main sections for navigation
mainSections: ['notification-jar', 'aquas-field', 'podcast-music', 'self-generation', 'toolbox', 'aquas-game']

# Enable Table of Contents
markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      taskList: true
      table: true
      strikethrough: true
      linkify: true
      typographer: true
  highlight:
    style: github
    codeFences: true
    lineNos: true
    copy: true
    anchorLineNos: true
    guessSyntax: true
    tabWidth: 2
    wrap: true

# Enable emoji support
enableEmoji: true

# Ensure all generated asset links use absolute URLs from baseURL
canonifyURLs: true

# Output formats for search
outputs:
  home: ["HTML", "JSON", "Calendar", "RSS"]

mediaTypes:
  application/json:
    suffixes:
      - json

outputFormats:
  Calendar:
    mediaType: "application/json"
    baseName: "calendar"
    isPlainText: true
    notAlternative: true

# Development settings
disablePathToLower: true

# Build settings
buildFuture: true

# Using GitHub Actions to deploy; output directory is controlled by the workflow


