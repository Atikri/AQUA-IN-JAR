    <h1>肱三头肌</h1>
    <h4></h4>
    <p class="author-date"><time datetime="2025-09-18T00:00:00Z">September 18, 2025</time></p>

<p><a href="https://tikri.site/aquas-field/reading-notes/%E8%AE%A9%E4%BD%93%E6%B6%B2%E6%B5%81%E8%B5%B7%E6%9D%A5outline/">让体液流起来outline</a></p>
<hr>
<p>揉按腋下至手肘这一段，能够引流淤积的血液或淋巴液。
肱三头肌位于上臂后方。肱二头肌和肱三头肌相互抗衡。肱三头肌协调肱二头肌的收缩程度。但是肱三头肌常常被人忽视。

没经验的还是用手比较保险。
