        </style>
        <rect width="1200" height="630" fill="#f0efea" />
        <foreignObject x="80" y="200" width="840" height="300">
            <div xmlns="http://www.w3.org/1999/xhtml">
                <div style="font-family: Newsreader, serif; font-size: 78px; font-weight: 600; margin-bottom: 20px; word-wrap: break-word;">肱三头肌</div>
                <div style="font-family: Newsreader, serif; font-size: 70px; font-weight: 400; word-wrap: break-word;">让体液流起来outline 揉按腋下至手肘这一段，能够引流淤积的血液或淋巴液。 肱三头肌位于上臂后方。肱二头肌和肱三头肌相互抗衡。肱三头肌协调肱二头肌的收缩程度。但是肱三头肌常常被人忽视。 没经验的还是用手比较保险。 继续阅读下一节：腰痛的原因是体液淤积</div>
            </div>
        </foreignObject>
    </svg>
    